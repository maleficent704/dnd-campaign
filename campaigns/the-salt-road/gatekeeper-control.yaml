# Planted-leak control for the caravan guard (P4.7). Per-campaign by nature: a planted
# leak has to be about this campaign's own secrets.
#
# Two of the planted cases leak *player-character* canon — Corin's grifter past, Hammond's
# cult years — which Kelly and Sam wrote at co-creation and which no NPC has any way to
# know. Those are the leaks that would actually matter at this table, which is why they
# are here instead of a secret invented for the fixture.
#
# Cases 4-6 are **diluted**: mostly-clean replies with one invented clause. P4.4 found the
# gate catching bare inventions at 5/5 and then walking past the same invention wrapped in
# three honest sentences, so a control made only of obvious cases measures the easy
# version of the failure.
cases:
- draft: >-
    You've got the look of a man who's run a con before. I've seen your kind work a
    crowd.
  invents: true
  note: "PC canon — Corin's grifter past. He has no way to know it."
- draft: >-
    And you, friar. Six years with those doomsday people, wasn't it? Word gets around.
  invents: true
  note: "PC canon — Hammond's cult years."
- draft: >-
    Ferris saw you by that wagon at the noon stop. Says you were there a good while.
  invents: true
  note: A named witness and a time. Neither exists.
- draft: >-
    I don't know what you were after. Crate's gone, that's all I know, and the wheels are
    still in the ruts. The other guard says he saw you near the wagons before the sun
    dropped.
  invents: true
  note: Diluted — two honest sentences, then testimony from the second guard that nobody gave.
- draft: >-
    Look. I'm not saying you took it. But the master's coming back from the well-house
    and he already knows there's a crate short, so you'd best have something better than
    a dwarf in a red shirt.
  invents: true
  note: >-
    Diluted, and it contradicts canon rather than merely adding to it — the master has not
    been told.
- draft: >-
    There's a lockbox under the driver's bench and I've already checked it. Nothing
    touched.
  invents: true
  note: An object on the wagon that is not in the ledger, plus a search that never happened.
- draft: >-
    You were elbow-deep in my canvas two minutes ago. That's what I know.
  invents: false
  note: Established in play, in front of everyone.
- draft: >-
    Crate went off the third wagon, some time after the noon stop. No forced entry, no
    tool marks on the boards.
  invents: false
  note: Straight from his own scope.
- draft: >-
    Master's at the well-house. He'll be back soon enough and you can tell it to him.
  invents: false
  note: In scope, and says nothing about what the master knows.
- draft: >-
    Far as I'm concerned this one took it. I've not seen anything to say otherwise.
  invents: false
  note: >-
    His own belief, stated as belief. The P4.4 false-positive shape — an honest opinion
    quietly rewritten out of a character's mouth is the harm nobody at the table can see.
- draft: >-
    It's been a long day and the wheels are still in the ruts. I want this done before
    dark and I want the crate back.
  invents: false
  note: Feelings, weather, the business of the day. His own to colour freely.
- draft: >-
    Couldn't tell you what's in the other wagons. Not my load.
  invents: false
  note: A refusal, which is always fine.
- draft: >-
    My cargo went off my wagon, on my watch. I want it back before the master gets here.
  invents: false
  note: >-
    Grounded in the voice card rather than the canon list, and taken verbatim from his own
    sample lines. Live on 2026-09-02 (g) the gate revised exactly this away as an
    invention, because the checker was told what he knows and never who he is — the
    finding that added the "Who they are" section to the gatekeeper prompt.
