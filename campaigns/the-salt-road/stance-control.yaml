# Positive control for the supersession pass (P4.6) — `dndc npc stance <name> --campaign
# the-salt-road`.
#
# The P2.6 rule where it is easiest to break. This pass **fails open**: a dead host, an
# unparseable verdict and a correctly cautious judge all produce the same empty result, so
# "nothing was retired tonight" means nothing at all until something has shown the judge
# retires what is definitely incompatible and leaves alone what definitely is not.
#
# The standing beliefs are the campaign's own, read live from `canon.yaml` — these cases are
# written against what the guard and the teamster actually think after session 1, not
# against a fixture. That is the point: a change of mind is only incompatible with a belief
# somebody really holds.
#
# The two errors are not symmetric and the file is weighted accordingly (three planted, six
# clean). A belief kept in error is audible — the character says something that no longer
# fits, and the table notices. A belief retired in error leaves their head for the rest of
# the campaign and nobody ever notices it went.
#
# `retires` names the standing belief **by its exact text**, so a case survives the ledger
# being re-minted and reads as a scene rather than as a fixture.

cases:

# --- planted: these must be retired ---------------------------------------

- npc: the caravan guard
  belief: >-
    The accused teamster did not take the crate, and the guard has accepted it.
  retires:
  - The caravan guard is certain the accused teamster took the crate, and is not
    interested in other explanations.
  note: >-
    The straight contradiction, and the scene the whole task was built for: the party
    talks him round. He cannot be certain the teamster took it and accept that he did not.

- npc: the caravan guard
  belief: >-
    The guard believes the stranger who was at his canvas has been straight with him from
    the start.
  retires:
  - The caravan guard believes the stranger who was at his canvas is lying to him and is
    mixed up in the theft.
  note: >-
    The same shape aimed at a player character. This is the one that would hurt to miss:
    a guard who still privately holds Corin a liar will keep playing her as one, in every
    prompt, however the scene appeared to end.

- npc: the caravan guard
  belief: >-
    Neither the teamster nor the stranger took the crate — the guard now thinks it was
    gone before the caravan ever reached the noon stop.
  retires:
  - The caravan guard is certain the accused teamster took the crate, and is not
    interested in other explanations.
  - The caravan guard believes the stranger who was at his canvas is lying to him and is
    mixed up in the theft.
  note: >-
    One change of mind retiring two beliefs. The reason the ledger needed `retire()`
    rather than `supersede()` — minting a copy of this sentence per retirement would file
    the same thought twice and leave Phase 7 counting it as two.

# --- clean: these must retire nothing --------------------------------------

- npc: the caravan guard
  belief: The caravan master is back from the well-house.
  note: News, not a change of mind. Touches nothing he already thinks.

- npc: the caravan guard
  belief: >-
    The guard believes there were fresh cart tracks on the north road when the caravan
    stopped.
  note: >-
    The over-correction guard, and the hardest of the clean cases: a detail that gives him
    every reason to doubt himself and does not touch either belief. A judge that retires
    this one is retiring on relatedness rather than on conflict.

    This case replaced a worse one, and the replacement is the finding. It was originally
    "the flap was already loose before the stranger ever touched it" — which the judge
    retired, and was **right** to. The loose flap is precisely what Corin is accused of
    lying about, so believing it is accepting her account, and "she is lying to me" cannot
    stand beside it. The control caught the author rather than the judge, three sessions
    running (the leak vector in (f), the voice card in (g), this).

- npc: the caravan guard
  belief: The guard believes the teamster is frightened.
  note: >-
    Frightened and guilty are perfectly compatible, and a character is not a proof system.
    A judge that cannot hold two beliefs that merely sit oddly together will strip every
    character in the campaign down to one thought at a time.

- npc: the caravan guard
  belief: The guard thinks the crate was heavy enough to want two men to move it.
  note: Unrelated to either standing belief. Ordinary business of the trade.

- npc: the caravan guard
  belief: >-
    The guard is angry that the caravan has lost a day to this and blames whoever is
    responsible.
  note: A feeling, and one that agrees with what he already thinks rather than replacing it.

- npc: the accused teamster
  belief: The teamster believes the guard will not listen to him whatever he says.
  note: >-
    A second character, and a guard against the crudest failure: a judge that retires
    something on every change of mind, whatever it says. His one standing belief — that he
    did not take it and cannot prove it — survives this untouched.
