[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dndc"
version = "0.1.0"
description = "Claude-GM'd D&D 5e campaign engine with a deterministic rules core"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.7",
    # `api` GM adapter (D-004). Imported lazily, so the rules core, the CLI, and the
    # whole test suite still work if it is absent.
    "anthropic>=0.116",
]

[project.optional-dependencies]
# The LAN front end (Phase 6). Optional on purpose: the rules core, the CLI and the whole
# test suite must still run on a machine that has none of this, the way they already do
# without `anthropic` present. Web tests skip themselves when it is absent.
web = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "dndc[web]",
]

[project.scripts]
dndc = "dndc.game.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dndc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
