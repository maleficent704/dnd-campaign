<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dndc</title>
<style>
  :root {
    --ink: #efe9df; --dim: #9a9186; --faint: #6b645b;
    --ground: #16150f; --panel: #1e1c15; --edge: #2e2b21;
    --npc: #d8b978; --you: #8fb4c8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font: 16px/1.65 Iowan Old Style, Palatino, Georgia, serif;
    -webkit-text-size-adjust: 100%;
  }
  header {
    position: sticky; top: 0; z-index: 2;
    background: var(--panel); border-bottom: 1px solid var(--edge);
    padding: .7rem 1rem; display: flex; flex-wrap: wrap;
    gap: .3rem 1rem; align-items: baseline;
  }
  h1 { font-size: 1.05rem; margin: 0; font-weight: 600; letter-spacing: .01em; }
  .scene { color: var(--dim); font-style: italic; font-size: .95rem; }
  .who { margin-left: auto; color: var(--faint); font-size: .8rem; }
  main { max-width: 42rem; margin: 0 auto; padding: 1.2rem 1rem 4rem; }
  .turn { margin: 0 0 1.9rem; }
  .said {
    color: var(--you); font-size: .95rem; margin: 0 0 .55rem;
    padding-left: .8rem; border-left: 2px solid #33505f;
  }
  .said b { font-weight: 600; opacity: .8; }
  .narration { margin: 0; white-space: pre-wrap; }
  .line {
    margin: .8rem 0 0; padding-left: .8rem;
    border-left: 2px solid #5d4d28; color: var(--npc);
  }
  .line b { display: block; font-size: .78rem; letter-spacing: .06em;
            text-transform: uppercase; color: #a08a55; font-weight: 600; }
  .pending { opacity: .92; }
  .pending::after {
    content: "▍"; animation: blink 1.1s steps(1) infinite; color: var(--dim);
  }
  @keyframes blink { 50% { opacity: 0; } }
  .party { display: flex; flex-wrap: wrap; gap: .5rem; margin: 0 0 1.6rem; }
  .member {
    background: var(--panel); border: 1px solid var(--edge); border-radius: 3px;
    padding: .35rem .6rem; font-size: .82rem;
  }
  .member .hp { color: var(--dim); }
  .member .turnnow { color: var(--npc); }
  details { margin: 2rem 0 0; border-top: 1px solid var(--edge); padding-top: .9rem; }
  summary { cursor: pointer; color: var(--dim); font-size: .85rem; }
  details ul { margin: .6rem 0 0; padding-left: 1.1rem; color: var(--dim);
               font-size: .88rem; }
  details li { margin: .25rem 0; }
  footer { color: var(--faint); font-size: .78rem; text-align: center;
           padding: 0 1rem 2rem; }
  .off { color: #c98b6a; }

  #say { position: sticky; bottom: 0; background: var(--ground);
         border-top: 1px solid var(--edge); padding: .7rem 1rem 1rem; }
  #say form { max-width: 42rem; margin: 0 auto; display: flex; gap: .5rem; }
  #say select, #say input, #say button {
    font: inherit; font-size: .95rem; background: var(--panel); color: var(--ink);
    border: 1px solid var(--edge); border-radius: 3px; padding: .5rem .6rem;
  }
  #say input { flex: 1; min-width: 0; }
  #say button { cursor: pointer; }
  #say input:disabled, #say button:disabled { opacity: .45; cursor: not-allowed; }
  #whose { max-width: 42rem; margin: 0 auto .45rem; font-size: .8rem; color: var(--dim); }
  #whose.refused { color: #c98b6a; }

  #question { max-width: 42rem; margin: 0 auto .6rem; background: var(--panel);
              border: 1px solid #4a4330; border-radius: 3px; padding: .6rem .75rem; }
  #question h2 { font-size: .82rem; letter-spacing: .05em; text-transform: uppercase;
                 color: #a08a55; margin: 0 0 .45rem; font-weight: 600; }
  #question ol { margin: 0; padding-left: 1.3rem; font-size: .9rem; }
  #question li { margin: .2rem 0; }
  #question .alt { display: block; color: var(--faint); font-size: .84rem; }
  #question .note { color: #c98b6a; font-size: .84rem; margin: 0 0 .35rem; }

  /* The start screen (P6.7b-iii). A hosted server boots with nobody playing, and a
     blank page would look broken rather than ready. */
  #start { max-width: 42rem; margin: 2.5rem auto; padding: 0 1rem; }
  #start h2 { font-size: 1rem; margin: 0 0 .2rem; font-weight: 600; }
  #start p { color: var(--dim); font-size: .92rem; margin: 0 0 1.2rem; }
  #start ul { list-style: none; margin: 0; padding: 0; }
  #start li { border: 1px solid var(--edge); border-radius: 3px; background: var(--panel);
              margin: 0 0 .5rem; }
  #start button.pick { width: 100%; text-align: left; background: none; border: 0;
                       color: var(--ink); font: inherit; padding: .7rem .85rem;
                       cursor: pointer; }
  #start button.pick:hover { background: #262319; }
  #start button.pick:disabled { cursor: default; opacity: .5; }
  #start .players { display: block; color: var(--faint); font-size: .84rem; }
  #start .none { color: var(--faint); font-size: .9rem; font-style: italic; }
  #start .wrong { color: #c98b6a; font-size: .88rem; margin: 0 0 1rem; }
  #endbox { max-width: 42rem; margin: 0 auto 3rem; padding: 0 1rem; }
  #end { background: none; border: 1px solid var(--edge); border-radius: 3px;
         color: var(--faint); font: inherit; font-size: .84rem; padding: .35rem .7rem;
         cursor: pointer; }
  #end:hover { color: var(--ink); border-color: var(--dim); }
</style>

<header>
  <h1 id="campaign">…</h1>
  <span class="scene" id="scene"></span>
  <span class="who" id="status">connecting</span>
</header>

<section id="start" hidden>
  <h2>Nothing is playing</h2>
  <p id="startwhy">Pick a campaign to begin the evening.</p>
  <p class="wrong" id="starterror" hidden></p>
  <ul id="campaigns"></ul>
</section>

<main>
  <div class="party" id="party"></div>
  <div id="log"></div>
  <details id="knownbox" hidden>
    <summary>What you know so far</summary>
    <ul id="known"></ul>
  </details>
</main>

<div id="say" hidden>
  <div id="question" hidden></div>
  <div id="whose"></div>
  <form id="form">
    <select id="asme" title="which character you are playing"></select>
    <input id="text" autocomplete="off" placeholder="what do you do?">
    <button id="send" type="submit">say</button>
  </form>
</div>

<div id="endbox" hidden><button id="end" type="button">end the evening</button></div>

<footer id="foot">watching only — this screen cannot take a turn</footer>

<script>
(function () {
  "use strict";
  var el = function (id) { return document.getElementById(id); };
  var log = el("log"), pendingNode = null, turnNode = null, latest = null;
  var canPlay = false;

  function text(tag, cls, body) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (body !== undefined) n.textContent = body;
    return n;
  }

  function drawParty(view) {
    var box = el("party");
    box.textContent = "";
    (view.party || []).forEach(function (m) {
      var n = text("span", "member");
      n.appendChild(text("span", null, m.name));
      if (m.pronouns) n.appendChild(text("span", "hp", " (" + m.pronouns + ")"));
      if (m.hp_max !== null && m.hp_max !== undefined) {
        n.appendChild(text("span", "hp", "  " + m.hp_current + "/" + m.hp_max));
      }
      if (m.name === view.acting) n.appendChild(text("span", "turnnow", "  ← their turn"));
      box.appendChild(n);
    });
  }

  function drawTurn(turn) {
    var wrap = text("div", "turn");
    if (!turn.opening && turn.said) {
      var said = text("p", "said");
      said.appendChild(text("b", null, turn.speaker + ": "));
      said.appendChild(text("span", null, turn.said));
      wrap.appendChild(said);
    }
    wrap.appendChild(text("p", "narration", turn.narration));
    (turn.dialogue || []).forEach(function (d) {
      var line = text("div", "line");
      line.appendChild(text("b", null, d.speaker));
      line.appendChild(text("span", null, d.text));
      wrap.appendChild(line);
    });
    return wrap;
  }

  // Who this device is playing. Remembered per browser so a phone does not ask every
  // time; it is a convenience and not a credential, and the LAN has no auth at all.
  var ME_KEY = "dndc.me";
  function me() {
    try { return localStorage.getItem(ME_KEY) || ""; } catch (e) { return ""; }
  }
  function setMe(name) {
    try { localStorage.setItem(ME_KEY, name); } catch (e) { /* private window */ }
  }

  function drawWho(view) {
    var pick = el("asme"), box = el("say"), whose = el("whose");
    if (!canPlay) { box.hidden = true; return; }
    box.hidden = false;
    el("foot").textContent = "anyone on this network can play as anyone — there is no login";

    var names = (view.party || []).map(function (m) { return m.name; });
    if (pick.options.length !== names.length) {
      pick.textContent = "";
      names.forEach(function (n) {
        var o = document.createElement("option");
        o.value = n; o.textContent = n;
        pick.appendChild(o);
      });
    }
    if (!me() && names.length) setMe(names[0]);
    if (me()) pick.value = me();

    if (pending) return;
    var mine = view.acting && pick.value === view.acting;
    el("text").disabled = !mine;
    el("send").disabled = !mine;
    whose.className = "";
    whose.textContent = mine
      ? "your turn"
      : (view.acting ? "waiting for " + view.acting : "waiting for the session to start");
  }

  // A question stops the evening, so it is drawn above the input and the input answers
  // it — whoever is holding the device. A confirmation belongs to the table, not to
  // whoever's turn it happens to be.
  var pending = null;
  function drawQuestion(q) {
    pending = q;
    var box = el("question"), input = el("text");
    if (!q) {
      box.hidden = true;
      input.placeholder = "what do you do?";
      if (latest) drawWho(latest);
      return;
    }
    box.hidden = false;
    box.textContent = "";
    box.appendChild(text("h2", null, q.prompt));
    (q.notes || []).forEach(function (n) { box.appendChild(text("p", "note", n)); });
    if ((q.choices || []).length) {
      var list = document.createElement("ol");
      q.choices.forEach(function (c) {
        var item = text("li", null, c.text);
        (c.detail || []).forEach(function (d) { item.appendChild(text("span", "alt", "also: " + d)); });
        list.appendChild(item);
      });
      box.appendChild(list);
    }
    el("say").hidden = !canPlay;
    input.disabled = false;
    el("send").disabled = false;
    input.placeholder = q.accepts_text ? "enter to accept, n to keep, or type a new one"
                                       : "all / none / numbers";
    el("whose").className = "";
    el("whose").textContent = "the table is being asked";
  }

  function drawKnown(view) {
    var list = el("known"), known = view.known || [];
    el("knownbox").hidden = known.length === 0;
    list.textContent = "";
    known.forEach(function (fact) { list.appendChild(text("li", null, fact)); });
  }

  // A settled state replaces everything. The server is the truth and the screen is a
  // picture of it; reconciling in the browser would be a second place for the campaign
  // to be wrong.
  function drawTable(view) {
    if (!view) return;
    latest = view;
    el("campaign").textContent = view.campaign;
    el("scene").textContent = view.scene || "";
    drawParty(view);
    drawKnown(view);
    drawWho(view);
    log.textContent = "";
    (view.turns || []).forEach(function (t) { log.appendChild(drawTurn(t)); });
    pendingNode = null;
    turnNode = null;
    atBottom();
  }

  function pending() {
    if (!pendingNode) {
      turnNode = text("div", "turn");
      pendingNode = text("p", "narration pending", "");
      turnNode.appendChild(pendingNode);
      log.appendChild(turnNode);
    }
    return pendingNode;
  }

  function atBottom() {
    window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
  }

  // The server says what it is doing on the same channel it says everything else on:
  // `phase` rides in every snapshot, so a page that reconnects after an evening ended
  // draws a start screen rather than an empty transcript it cannot explain.
  var manageable = false;

  function drawPhase(msg) {
    if (msg.phase === undefined) return;
    manageable = !!msg.manageable;
    var idle = msg.phase === "idle", starting = msg.phase === "starting";

    el("start").hidden = !(idle && manageable);
    el("endbox").hidden = !(msg.phase === "playing" && manageable && msg.writable);
    var wrong = el("starterror");
    wrong.hidden = !msg.error;
    wrong.textContent = msg.error || "";

    if (starting) {
      el("status").textContent = "starting the evening…";
      el("status").className = "who";
    } else if (idle && manageable) {
      el("campaign").textContent = "dndc";
      el("startwhy").textContent = "Pick a campaign to begin the evening.";
      loadCampaigns();
    }
    // The say-box belongs to an evening; an idle server should not offer one.
    if (idle) el("say").hidden = true;
  }

  function loadCampaigns() {
    fetch("/api/campaigns").then(function (r) {
      return r.ok ? r.json() : { campaigns: [] };
    }).then(function (body) {
      var list = el("campaigns");
      list.textContent = "";
      var found = body.campaigns || [];
      if (!found.length) {
        list.appendChild(text("li", "none", "no campaigns yet — dndc create-character"));
        return;
      }
      found.forEach(function (c) {
        var item = document.createElement("li");
        var button = document.createElement("button");
        button.className = "pick";
        button.type = "button";
        button.appendChild(text("span", null, c.name));
        button.appendChild(text("span", "players", (c.players || []).join(", ")));
        button.addEventListener("click", function () {
          begin(c.slug, button);
        });
        item.appendChild(button);
        list.appendChild(item);
      });
    }).catch(function () { /* the stream will bring us back */ });
  }

  function begin(slug, button) {
    // Disabled on click and left that way: the answer arrives as a `phase` on the
    // stream, not as this response, and a button that re-enabled itself would invite a
    // second evening on top of the one now being built.
    if (button) button.disabled = true;
    el("startwhy").textContent = "starting — the recap can take a minute or two…";
    fetch("/api/session", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ campaign: slug })
    }).then(function (r) {
      if (r.ok) return;
      return r.json().then(function (body) {
        el("startwhy").textContent = body.reason || "that did not start";
        if (button) button.disabled = false;
      });
    }).catch(function () {
      if (button) button.disabled = false;
    });
  }

  el("end").addEventListener("click", function () {
    el("end").disabled = true;
    fetch("/api/session/end", { method: "POST" }).catch(function () {}).then(function () {
      el("end").disabled = false;
    });
  });

  function handle(msg) {
    if (msg.kind === "table") {
      drawPhase(msg);
      // A spectator link says so, and the input is never offered there — a device should
      // not be shown a box that every submission will be refused from.
      if (msg.writable !== undefined) canPlay = msg.writable;
      drawTable(msg.table);
      if (msg.question !== undefined) drawQuestion(msg.question);
      if (msg.pending) { pending().textContent = msg.pending; }
      (msg.spoken || []).forEach(function (d) { handle({ kind: "line", speaker: d.speaker, text: d.text }); });
      atBottom();
    } else if (msg.kind === "narrating") {
      pending().textContent += msg.text;
      atBottom();
    } else if (msg.kind === "line") {
      pending();
      var line = text("div", "line");
      line.appendChild(text("b", null, msg.speaker));
      line.appendChild(text("span", null, msg.text));
      turnNode.appendChild(line);
      atBottom();
    } else if (msg.kind === "note") {
      pending();
      turnNode.appendChild(text("p", "said", msg.text));
      atBottom();
    } else if (msg.kind === "asking") {
      drawQuestion(msg.question);
    } else if (msg.kind === "answered") {
      drawQuestion(null);
    } else if (msg.kind === "ended") {
      el("status").textContent = "session ended";
      el("status").className = "who off";
    }
  }

  // EventSource reconnects on its own, and every reconnect re-sends the snapshot, so a
  // phone that slept through three turns wakes up correct rather than three turns behind.
  function connect() {
    var source = new EventSource("/api/events");
    source.onopen = function () {
      el("status").textContent = "watching";
      el("status").className = "who";
    };
    source.onmessage = function (event) {
      try { handle(JSON.parse(event.data)); } catch (e) { /* a partial frame; the next is whole */ }
    };
    source.onerror = function () {
      el("status").textContent = "reconnecting…";
      el("status").className = "who off";
    };
  }

  connect();

  el("asme").addEventListener("change", function () {
    setMe(el("asme").value);
    if (latest) drawWho(latest);
  });

  el("form").addEventListener("submit", function (event) {
    event.preventDefault();
    var input = el("text"), said = input.value.trim();
    if (!said) return;
    input.disabled = true;
    el("send").disabled = true;
    var where = pending ? "/api/answer" : "/api/turn";
    var payload = pending ? { text: said }
                          : { character: el("asme").value, text: said };
    fetch(where, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    }).then(function (r) {
      if (r.ok) { input.value = ""; return; }
      return r.json().then(function (body) {
        var whose = el("whose");
        whose.className = "refused";
        whose.textContent = body.reason || "that was not accepted";
        // Left in the box on purpose: a sentence somebody typed should not vanish
        // because the timing was wrong.
        input.disabled = false;
        el("send").disabled = false;
      });
    }).catch(function () {
      input.disabled = false;
      el("send").disabled = false;
    });
  });
})();
</script>
