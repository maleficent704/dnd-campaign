# config.yaml — model seats, endpoints, session defaults
# Never hardcode models/URLs in code — everything routes through this file.

billing:
  default: api                             # api | subscription — sticky default; CLI asks at session start
                                   # Back to `api` 2026-08-10 (Kelly). OD-16: subscription-mode
                                   # cost figures measure headless CC's harness, not the campaign,
                                   # so campaign cost claims come from `api` runs only.
  api_monthly_cap_note: "Console spend cap set by Kelly (~$20-25/mo) — safety rail"

seats:
  gm:
    backend: gmbackend    # resolved by billing choice at runtime
    model_default: claude-sonnet-5
    model_threshold: claude-opus-5     # authored threshold moments only (D-004)
  npc:
    backend: ollama
    endpoint: http://192.168.50.11:11434   # toto-llm (dual 3090)
    model: llama3.3:70b
  # Two utility seats, not one (Fable, 2026-08-14). The jobs have opposite tradeoffs:
  # the sweep is confirmation-gated and the table waits on it, so recall and 3.7s win;
  # the chronicle is ungated and comprehension-critical, and 180s on a batch job nobody
  # watches is free. Grounding cannot catch a relationship inversion, so the fix has to
  # be a better writer rather than a better check.
  utility_interactive:
    backend: ollama
    endpoint: http://192.168.50.11:11434   # move to sam-pc when installed (Phase 4+)
    model: llama3.1:8b
  utility_batch:
    backend: ollama
    endpoint: http://192.168.50.11:11434   # toto-llm (dual 3090)
    model: llama3.3:70b

ollama_endpoints:         # routing table (Phase 4 router consumes this)
  toto-llm: http://192.168.50.11:11434
  sam-pc: http://192.168.50.161:11434     # not yet installed — register only

pricing:                  # USD per million tokens — data, not code (D-008 cost telemetry
                          # and D-004 would-have-cost). A rate change is a config edit.
                          # cache_write is 1.25x input, cache_read 0.1x; both are derived
                          # if omitted. Standard rates: Sonnet 5 has a lower introductory
                          # rate ($2/$10) through 2026-08-31, so these over-estimate
                          # slightly until then — deliberately, rather than under-report.
  claude-sonnet-5:
    input: 3.00
    output: 15.00
  claude-opus-5:
    input: 5.00
    output: 25.00
  claude-haiku-4-5:
    input: 1.00
    output: 5.00

gameplay:
  scaffolding: high       # high | low | off — D-006 new-player option surfacing
  play_mode: hotseat      # hotseat until Phase 6 GUI (OD-4)

logging:
  dir: logs/
  stamp_commit_sha: true
